name: CI

on:
  push:
    branches: [master]
  pull_request:

# One deploy at a time: two quick pushes to master would otherwise race two
# force-pushes to gh-pages.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.9', '3.12']   # declared floor + dev version
    env:
      MPLBACKEND: Agg                     # the suite renders figures headlessly
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e '.[dev]'
      - run: pytest -q

  docs:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write          # required to push to gh-pages
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0       # gh-deploy needs history for the gh-pages branch
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -e '.[docs]'
      - name: Build the site strictly
        run: mkdocs build --strict
      - name: Deploy to gh-pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdocs gh-deploy --force
